apiVersion: v1
kind: Service
metadata:
  name: harness-lab-app-svc
  annotations:
    harness.io/primary-service: "true"
    harness.io/staging-service: "true"
spec:
  type: LoadBalancer
  selector:
    app: harness-lab-app
  ports:
    - name: http
    - port: 80
      targetPort: 5000
      protocol: TCP
