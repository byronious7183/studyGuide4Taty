<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Anatomy Quiz Show</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #282342;
      --purple: #7048a8;
      --pink: #f5a8cf;
      --paper: #fffaff;
      --line: #e5d9f2;
    }
    * { box-sizing: border-box; }
    body {
	margin: 0;
	padding: 24px;
	background:
		linear-gradient(rgba(252, 230, 242, 0.78), rgba(232, 232, 255, 0.78)),
		url("images/pony-background.jpg") center / cover fixed;
	color: var(--ink);
	font: 17px/1.5 system-ui, sans-serif;
	}

    main {
      width: min(720px, 100%);
      margin: 24px auto;
      padding: clamp(20px, 5vw, 40px);
      background: var(--paper);
      border: 3px solid white;
      border-radius: 24px;
      box-shadow: 0 12px 36px #45306c22;
    }
    h1 { margin: 0 0 6px; text-align: center; color: var(--purple); }
    .subtitle, #progress { text-align: center; }
    #host {
      margin: 24px 0 12px;
      padding: 14px 18px;
      background: #f3ecff;
      border-radius: 16px;
    }
    #question {
      margin: 20px 0;
      font-size: 1.3rem;
      font-weight: 700;
    }
    #answers { display: grid; gap: 10px; }
    button {
      border: 2px solid var(--line);
      border-radius: 12px;
      padding: 12px 16px;
      background: white;
      color: var(--ink);
      font: inherit;
      text-align: left;
      cursor: pointer;
    }
    button:hover:enabled { border-color: var(--purple); background: #faf6ff; }
    button:focus-visible { outline: 3px solid #f0a4ce; outline-offset: 2px; }
    button:disabled { cursor: default; opacity: .8; }
    #next, #restart {
      margin-top: 18px;
      background: var(--purple);
      border-color: var(--purple);
      color: white;
      font-weight: 700;
      text-align: center;
    }
    #feedback { min-height: 3em; margin: 18px 0 0; font-weight: 600; }
    .small { color: #655b75; font-size: .92rem; }
    .hidden { display: none; }
	
	#brain-picture {
		position: relative;
		width: min(100%, 500px);
		margin: 16px auto;
	}

	#brain-picture img {
		display: block;
		width: 100%;
		height: auto;
		border-radius: 12px;
	}

	#brain-marker {
		position: absolute;
		left: 50%;
		top: 50%;
		width: 24px;
		height: 24px;
		border: 4px solid white;
		border-radius: 50%;
		background: #e83e76;
		box-shadow: 0 0 0 3px #39264f;
		transform: translate(-50%, -50%);
	}
	.hidden { display: none; }

  </style>
</head>
<body>
<main>
  <h1>✨ Anatomy Quiz Show ✨</h1>
  <p class="subtitle">A friendly vocabulary challenge</p>
  <p id="progress" aria-live="polite"></p>
  <section id="game" aria-labelledby="question">
    <div id="host" aria-live="polite"></div>
    <div id="question"></div>
    <div id="answers"></div>
    <p id="feedback" aria-live="polite"></p>
    <button id="next" class="hidden">Next question →</button>
  </section>
  <section id="end" class="hidden">
	<h2>That’s the show!</h2>
	<p id="result"></p>
	<button id="start-brain">Start the brain round →</button>
	<button id="restart">Play vocabulary again</button>
  </section>
  <section id="brain-round" class="hidden">
	<p id="brain-progress"></p>
	<p id="brain-prompt"></p>

	<div id="brain-picture">
		<img id="brain-image" src="" alt="">
		<span id="brain-marker" aria-hidden="true"></span>
	</div>

	<div id="brain-answers"></div>
	<p id="brain-feedback" aria-live="polite"></p>
	<button id="brain-next" class="hidden">Next question →</button>
	<button id="brain-restart" class="hidden">Play the brain round again</button>
	</section>

	
  <p class="small">Practice definitions, then check them against your class notes.</p>
</main>

<script>
const questions = [
  {
    term: "Anatomical position",
    choices: [
      "Standing upright, facing forward, arms at the sides, palms facing forward",
      "Lying face down with arms overhead",
      "Sitting with legs crossed"
    ],
    answer: 0,
    hint: "Picture a person standing at attention and showing their palms."
  },
  {
    term: "Superior",
    choices: [
      "Toward the back of the body",
      "Above or toward the head",
      "Farther from the body’s midline"
    ],
    answer: 1,
    hint: "In anatomical directions, this means higher up or closer to the head."
  },
  {
    term: "Inferior",
    choices: [
      "Below or toward the feet",
      "Toward the front of the body",
      "Closer to the point where a limb attaches"
    ],
    answer: 0,
    hint: "Think of the opposite direction from superior."
  },
  {
    term: "Anterior",
    choices: [
      "Toward the back",
      "Toward the front",
      "Toward the side"
    ],
    answer: 1,
    hint: "This direction points toward the belly side of the body."
  },
  {
    term: "Posterior",
    choices: [
      "Toward the back",
      "Toward the head",
      "Toward the midline"
    ],
    answer: 0,
    hint: "This direction points toward the back side of the body."
  },
  {
    term: "Medial",
    choices: [
      "Farther from the body’s midline",
      "Closer to the body’s midline",
      "Closer to the skin’s surface"
    ],
    answer: 1,
    hint: "Imagine a line running down the center of the body."
  },
  {
    term: "Lateral",
    choices: [
      "Toward the body’s side, away from the midline",
      "Toward the body’s center",
      "Deep inside the body"
    ],
    answer: 0,
    hint: "The opposite of medial."
  },
  {
    term: "Proximal",
    choices: [
      "Farther from where a limb attaches",
      "Closer to where a limb attaches",
      "Toward the back"
    ],
    answer: 1,
    hint: "Often used for limbs: closer to the shoulder or hip."
  },
  {
    term: "Distal",
    choices: [
      "Farther from where a limb attaches",
      "Closer to where a limb attaches",
      "Closer to the midline"
    ],
    answer: 0,
    hint: "Often used for limbs: farther from the shoulder or hip."
  },
  {
    term: "Superficial",
    choices: [
      "Closer to the body’s surface",
      "Farther from the body’s surface",
      "Toward the feet"
    ],
    answer: 0,
    hint: "A superficial structure is nearer the outside."
  },
  {
    term: "Deep",
    choices: [
      "Closer to the body’s surface",
      "Farther inside the body, away from the surface",
      "Toward the front"
    ],
    answer: 1,
    hint: "The opposite of superficial."
  },
  {
    term: "Sagittal plane",
    choices: [
      "Divides the body into left and right portions",
      "Divides the body into front and back portions",
      "Divides the body into upper and lower portions"
    ],
    answer: 0,
    hint: "Its name goes with the left-right division."
  },
  {
    term: "Frontal (coronal) plane",
    choices: [
      "Divides the body into left and right portions",
      "Divides the body into front and back portions",
      "Divides the body into upper and lower portions"
    ],
    answer: 1,
    hint: "Imagine a flat sheet separating the front from the back."
  },
  {
    term: "Transverse plane",
    choices: [
      "Divides the body into upper and lower portions",
      "Divides the body into front and back portions",
      "Divides the body into left and right portions"
    ],
    answer: 0,
    hint: "This is a horizontal cross-section."
  }
];
const brainQuestions = [
  // Picture 2: interior (mid-sagittal) view
  {
    view: "interior",
    name: "Corpus callosum",
    x: 52, y: 43,
    hint: "This curved band connects the brain's two cerebral hemispheres."
  },
  {
    view: "interior",
    name: "Thalamus",
    x: 56, y: 51,
    hint: "This structure is near the center of the brain, above the brainstem."
  },
  {
    view: "interior",
    name: "Hypothalamus",
    x: 57, y: 56,
    hint: "Look just below the thalamus."
  },
  {
    view: "interior",
    name: "Pons",
    x: 53, y: 62,
    hint: "This rounded part of the brainstem sits in front of the cerebellum."
  },
  {
    view: "interior",
    name: "Medulla oblongata",
    x: 51, y: 69,
    hint: "This lower part of the brainstem continues toward the spinal cord."
  },
  {
    view: "interior",
    name: "Cerebellum",
    x: 73, y: 64,
    hint: "Look for the small, ridged structure at the back and bottom of the brain."
  },
  {
    view: "interior",
    name: "Occipital lobe",
    x: 77, y: 35,
    hint: "This lobe is at the back of the brain and is associated with vision."
  },

  // Picture 3: exterior (side) view
  {
    view: "exterior",
    name: "Frontal lobe",
    x: 77, y: 35,
    hint: "This lobe is toward the front of the brain."
  },
  {
    view: "exterior",
    name: "Parietal lobe",
    x: 53, y: 27,
    hint: "This lobe is near the upper rear portion of the cerebrum."
  },
  {
    view: "exterior",
    name: "Occipital lobe",
    x: 27, y: 38,
    hint: "This lobe is at the back of the brain."
  },
  {
    view: "exterior",
    name: "Temporal lobe",
    x: 57, y: 48,
    hint: "This lobe is on the side of the brain, roughly near the temples."
  },
  {
    view: "exterior",
    name: "Cerebellum",
    x: 27, y: 68,
    hint: "Look for the small, ridged structure at the back and bottom."
  }
];

const brainImageFiles = {
  interior: "/images/brain-interior.jpg",
  exterior: "/images/brain-exterior.jpg"
};

let brainOrder = [...brainQuestions].sort(() => Math.random() - 0.5);
let brainIndex = 0;
let brainScore = 0;
let brainAnswered = false;

function showBrainQuestion() {
  const q = brainOrder[brainIndex];
  const image = document.querySelector("#brain-image");
  const marker = document.querySelector("#brain-marker");
  const answers = document.querySelector("#brain-answers");
  const feedback = document.querySelector("#brain-feedback");
  const nextButton = document.querySelector("#brain-next");

  brainAnswered = false;
  image.src = brainImageFiles[q.view];
  image.alt = q.view === "interior"
    ? "Interior side view of a brain model"
    : "Exterior side view of a brain model";
  marker.style.left = `${q.x}%`;
  marker.style.top = `${q.y}%`;

  document.querySelector("#brain-progress").textContent =
    `Brain question ${brainIndex + 1} of ${brainOrder.length} · Score: ${brainScore}`;
  document.querySelector("#brain-prompt").textContent =
    `Which structure is marked in the ${q.view} view?`;

  feedback.textContent = "";
  nextButton.classList.add("hidden");
  answers.replaceChildren();

  // Use the correct answer plus two distinct distractors.
  const distractors = [...new Set(
    brainQuestions.map(item => item.name).filter(name => name !== q.name)
  )].sort(() => Math.random() - 0.5).slice(0, 2);

  const choices = [q.name, ...distractors]
    .sort(() => Math.random() - 0.5);

  choices.forEach(name => {
    const button = document.createElement("button");
    button.textContent = name;
    button.addEventListener("click", () => {
      if (brainAnswered) return;
      brainAnswered = true;

      [...answers.querySelectorAll("button")].forEach(b => b.disabled = true);

      if (name === q.name) {
        brainScore++;
        feedback.textContent = "Correct! Great job!";
      } else {
        feedback.textContent = `Not quite. Hint: ${q.hint}`;
      }

      document.querySelector("#brain-progress").textContent =
        `Brain question ${brainIndex + 1} of ${brainOrder.length} · Score: ${brainScore}`;

      nextButton.textContent =
        brainIndex === brainOrder.length - 1 ? "See results" : "Next question →";
      nextButton.classList.remove("hidden");
    });
    answers.append(button);
  });
}

document.querySelector("#brain-next").addEventListener("click", () => {
  brainIndex++;

  if (brainIndex < brainOrder.length) {
    showBrainQuestion();
  } else {
    document.querySelector("#brain-progress").textContent =
      `Brain round complete! Score: ${brainScore} out of ${brainOrder.length}`;
    document.querySelector("#brain-prompt").textContent =
      "Nice work—review any missed structures and try again!";
    document.querySelector("#brain-picture").classList.add("hidden");
    document.querySelector("#brain-answers").replaceChildren();
    document.querySelector("#brain-feedback").textContent = "";
    document.querySelector("#brain-next").classList.add("hidden");
    document.querySelector("#brain-restart").classList.remove("hidden");
  }
});

document.querySelector("#start-brain").addEventListener("click", () => {
  brainOrder = [...brainQuestions].sort(() => Math.random() - 0.5);
  brainIndex = 0;
  brainScore = 0;

  document.querySelector("#end").classList.add("hidden");
  document.querySelector("#brain-round").classList.remove("hidden");
  document.querySelector("#brain-picture").classList.remove("hidden");
  document.querySelector("#brain-restart").classList.add("hidden");

  showBrainQuestion();
});

document.querySelector("#brain-restart").addEventListener("click", () => {
  brainOrder = [...brainQuestions].sort(() => Math.random() - 0.5);
  brainIndex = 0;
  brainScore = 0;

  document.querySelector("#brain-picture").classList.remove("hidden");
  document.querySelector("#brain-restart").classList.add("hidden");

  showBrainQuestion();
});



const hosts = [
  { name: "Twilight Sparkle", intro: "Let’s use our anatomy smarts!" },
  { name: "Rainbow Dash", intro: "Ready to race through a question?" },
  { name: "Pinkie Pie", intro: "Quiz time! You’ve got this!" },
  { name: "Fluttershy", intro: "Take your time—you can do it." },
  { name: "Applejack", intro: "Let’s see what you know!" }
];
const praise = [
  "That’s right! Great work!",
  "Correct! You’re on a roll!",
  "Yes! Nicely done!",
  "You nailed it!"
];

let order = [];
let current = 0;
let score = 0;
let answered = false;

const hostEl = document.querySelector("#host");
const questionEl = document.querySelector("#question");
const answersEl = document.querySelector("#answers");
const feedbackEl = document.querySelector("#feedback");
const progressEl = document.querySelector("#progress");
const nextButton = document.querySelector("#next");

function shuffle(items) {
  return [...items].sort(() => Math.random() - 0.5);
}

function startGame() {
  order = shuffle(questions);
  current = 0;
  score = 0;
  document.querySelector("#game").classList.remove("hidden");
  document.querySelector("#end").classList.add("hidden");
  showQuestion();
}

function showQuestion() {
  answered = false;
  const q = order[current];
  const host = hosts[current % hosts.length];
  progressEl.textContent = `Question ${current + 1} of ${order.length} · Score: ${score}`;
  hostEl.textContent = `${host.name}: ${host.intro}`;
  questionEl.textContent = `What does “${q.term}” mean?`;
  feedbackEl.textContent = "";
  nextButton.classList.add("hidden");
  answersEl.replaceChildren();

  q.choices.forEach((choice, index) => {
    const button = document.createElement("button");
    button.textContent = choice;
    button.addEventListener("click", () => chooseAnswer(index));
    answersEl.append(button);
  });
}

function chooseAnswer(index) {
  if (answered) return;
  answered = true;
  const q = order[current];
  const buttons = [...answersEl.querySelectorAll("button")];
  buttons.forEach(button => button.disabled = true);

  if (index === q.answer) {
    score++;
    feedbackEl.textContent = praise[Math.floor(Math.random() * praise.length)];
    buttons[index].style.borderColor = "#38a56a";
  } else {
    feedbackEl.textContent =
      `Not quite. Hint: ${q.hint} The correct answer is: ${q.choices[q.answer]}`;
    buttons[index].style.borderColor = "#d66b83";
    buttons[q.answer].style.borderColor = "#38a56a";
  }

  progressEl.textContent = `Question ${current + 1} of ${order.length} · Score: ${score}`;
  nextButton.textContent = current === order.length - 1 ? "See my results" : "Next question →";
  nextButton.classList.remove("hidden");
}

nextButton.addEventListener("click", () => {
  current++;
  if (current < order.length) {
    showQuestion();
  } else {
    document.querySelector("#game").classList.add("hidden");
    document.querySelector("#end").classList.remove("hidden");
    progressEl.textContent = "";
    document.querySelector("#result").textContent =
      `You scored ${score} out of ${order.length}. ${score === order.length
        ? "Perfect score—fantastic work!"
        : "Every round is a chance to learn something new!"}`;
  }
});

document.querySelector("#restart").addEventListener("click", startGame);
startGame();
</script>
</body>
</html>
