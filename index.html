<head>

  <style>
    :root {
      color-scheme: light;
      --ink: #282342;
      --purple: #7048a8;
      --pink: #f5a8cf;
      --paper: #fffaff;
      --line: #e5d9f2;
    }
    * { box-sizing: border-box; }
    body {
	margin: 0;
	padding: 24px;
	background:
		linear-gradient(rgba(252, 230, 242, 0.78), rgba(232, 232, 255, 0.78)),
		url("images/pony-background.jpg") center / cover fixed;
	color: var(--ink);
	font: 17px/1.5 system-ui, sans-serif;
	}

    main {
      width: min(720px, 100%);
      margin: 24px auto;
      padding: clamp(20px, 5vw, 40px);
      background: var(--paper);
      border: 3px solid white;
      border-radius: 24px;
      box-shadow: 0 12px 36px #45306c22;
    }
    h1 { margin: 0 0 6px; text-align: center; color: var(--purple); }
    .subtitle, #progress { text-align: center; }
    #host {
      margin: 24px 0 12px;
      padding: 14px 18px;
      background: #f3ecff;
      border-radius: 16px;
    }
    #question {
      margin: 20px 0;
      font-size: 1.3rem;
      font-weight: 700;
    }
    #answers { display: grid; gap: 10px; }
    button {
      border: 2px solid var(--line);
      border-radius: 12px;
      padding: 12px 16px;
      background: white;
      color: var(--ink);
      font: inherit;
      text-align: left;
      cursor: pointer;
    }
    button:hover:enabled { border-color: var(--purple); background: #faf6ff; }
    button:focus-visible { outline: 3px solid #f0a4ce; outline-offset: 2px; }
    button:disabled { cursor: default; opacity: .8; }
    #next, #restart {
      margin-top: 18px;
      background: var(--purple);
      border-color: var(--purple);
      color: white;
      font-weight: 700;
      text-align: center;
    }
    #feedback { min-height: 3em; margin: 18px 0 0; font-weight: 600; }
    .small { color: #655b75; font-size: .92rem; }
    .hidden { display: none; }
	
	#brain-picture {
		position: relative;
		width: min(100%, 500px);
		margin: 16px auto;
	}

	#brain-picture img {
		display: block;
		width: 100%;
		height: auto;
		border-radius: 12px;
	}

	#brain-marker {
		position: absolute;
		left: 50%;
		top: 50%;
		width: 24px;
		height: 24px;
		border: 4px solid white;
		border-radius: 50%;
		background: #e83e76;
		box-shadow: 0 0 0 3px #39264f;
		transform: translate(-50%, -50%);
	}
	.hidden { display: none; }

  </style>
</head>

    <p id="feedback" aria-live="polite"></p>

  </section>
  <section id="end" class="hidden">

	<button id="restart">Play anatomy trivia again</button>

	<button id="brain-next" class="hidden">Next question →</button>

const brainImageFiles = {
  interior: "/images/brain-interior.jpg",
  exterior: "/images/brain-exterior.jpg"
};

let brainOrder = [...brainQuestions].sort(() => Math.random() - 0.5);
let brainIndex = 0;
let brainScore = 0;
let brainAnswered = false;

function showBrainQuestion() {
  const q = brainOrder[brainIndex];
  const image = document.querySelector("#brain-image");
  const marker = document.querySelector("#brain-marker");
  const answers = document.querySelector("#brain-answers");
  const feedback = document.querySelector("#brain-feedback");
  const nextButton = document.querySelector("#brain-next");

  brainAnswered = false;
  image.src = brainImageFiles[q.view];
  image.alt = q.view === "interior"
    ? "Interior side view of a brain model"
    : "Exterior side view of a brain model";
  marker.style.left = `${q.x}%`;
  marker.style.top = `${q.y}%`;

  document.querySelector("#brain-progress").textContent =
    `Brain question ${brainIndex + 1} of ${brainOrder.length} · Score: ${brainScore}`;
  document.querySelector("#brain-prompt").textContent =
    `Which structure is marked in the ${q.view} view?`;

  feedback.textContent = "";
  nextButton.classList.add("hidden");
  answers.replaceChildren();

  // Use the correct answer plus two distinct distractors.
  const distractors = [...new Set(
    brainQuestions.map(item => item.name).filter(name => name !== q.name)
  )].sort(() => Math.random() - 0.5).slice(0, 2);

  const choices = [q.name, ...distractors]
    .sort(() => Math.random() - 0.5);

  choices.forEach(name => {
    const button = document.createElement("button");
    button.textContent = name;
    button.addEventListener("click", () => {
      if (brainAnswered) return;
      brainAnswered = true;

      [...answers.querySelectorAll("button")].forEach(b => b.disabled = true);

      if (name === q.name) {
        brainScore++;
        feedback.textContent = "Correct! Great job!";
      } else {
        feedback.textContent = `Not quite. Hint: ${q.hint}`;
      }

      document.querySelector("#brain-progress").textContent =
        `Brain question ${brainIndex + 1} of ${brainOrder.length} · Score: ${brainScore}`;

      nextButton.textContent =
        brainIndex === brainOrder.length - 1 ? "See results" : "Next question →";
      nextButton.classList.remove("hidden");
    });
    answers.append(button);
  });
}

document.querySelector("#brain-next").addEventListener("click", () => {
  brainIndex++;

  if (brainIndex < brainOrder.length) {
    showBrainQuestion();
  } else {
    document.querySelector("#brain-progress").textContent =
      `Brain round complete! Score: ${brainScore} out of ${brainOrder.length}`;
    document.querySelector("#brain-prompt").textContent =
      "Nice work—review any missed structures and try again!";
    document.querySelector("#brain-picture").classList.add("hidden");
    document.querySelector("#brain-answers").replaceChildren();
    document.querySelector("#brain-feedback").textContent = "";
    document.querySelector("#brain-next").classList.add("hidden");
    document.querySelector("#brain-restart").classList.remove("hidden");
  }
});

document.querySelector("#start-brain").addEventListener("click", () => {
  brainOrder = [...brainQuestions].sort(() => Math.random() - 0.5);
  brainIndex = 0;
  brainScore = 0;

  document.querySelector("#end").classList.add("hidden");
  document.querySelector("#brain-round").classList.remove("hidden");
  document.querySelector("#brain-picture").classList.remove("hidden");
  document.querySelector("#brain-restart").classList.add("hidden");

  showBrainQuestion();
});

document.querySelector("#brain-restart").addEventListener("click", () => {
  brainOrder = [...brainQuestions].sort(() => Math.random() - 0.5);
  brainIndex = 0;
  brainScore = 0;

  document.querySelector("#brain-picture").classList.remove("hidden");
  document.querySelector("#brain-restart").classList.add("hidden");

  showBrainQuestion();
});



const hosts = [
  { name: "Twilight Sparkle", intro: "Let’s use our anatomy smarts!" },
  { name: "Rainbow Dash", intro: "Ready to race through a question?" },
  { name: "Pinkie Pie", intro: "Quiz time! You’ve got this!" },
  { name: "Fluttershy", intro: "Take your time—you can do it." },
  { name: "Applejack", intro: "Let’s see what you know!" }
];
const praise = [
  "That’s right! Great work!",
  "Correct! You’re on a roll!",
  "Yes! Nicely done!",
  "You nailed it!"
];

let order = [];
let current = 0;
let score = 0;
let answered = false;

const hostEl = document.querySelector("#host");
const questionEl = document.querySelector("#question");
const answersEl = document.querySelector("#answers");
const feedbackEl = document.querySelector("#feedback");
const progressEl = document.querySelector("#progress");
const nextButton = document.querySelector("#next");

function shuffle(items) {
  return [...items].sort(() => Math.random() - 0.5);
}

const QUESTIONS_PER_GAME = 30;

function startGame() {
  order = shuffle(questions).slice(0, QUESTIONS_PER_GAME);
  current = 0;
  score = 0;
  document.querySelector("#game").classList.remove("hidden");
  document.querySelector("#end").classList.add("hidden");
  showQuestion();
}

function showQuestion() {
  answered = false;
  const q = order[current];
  const host = hosts[current % hosts.length];
  progressEl.textContent = `Question ${current + 1} of ${order.length} · Score: ${score}`;
  hostEl.textContent = `${host.name}: ${host.intro}`;
  questionEl.textContent = q.prompt || `What does “${q.term}” mean?`;
  feedbackEl.textContent = "";
  nextButton.classList.add("hidden");
  answersEl.replaceChildren();

  q.choices.forEach((choice, index) => {
    const button = document.createElement("button");
    button.textContent = choice;
    button.addEventListener("click", () => chooseAnswer(index));
    answersEl.append(button);
  });
}

function chooseAnswer(index) {
  if (answered) return;
  answered = true;
  const q = order[current];
  const buttons = [...answersEl.querySelectorAll("button")];
  buttons.forEach(button => button.disabled = true);

  if (index === q.answer) {
    score++;
    feedbackEl.textContent = praise[Math.floor(Math.random() * praise.length)];
    buttons[index].style.borderColor = "#38a56a";
  } else {
    feedbackEl.textContent =
      `Not quite. Hint: ${q.hint} The correct answer is: ${q.choices[q.answer]}`;
    buttons[index].style.borderColor = "#d66b83";
    buttons[q.answer].style.borderColor = "#38a56a";
  }

  progressEl.textContent = `Question ${current + 1} of ${order.length} · Score: ${score}`;
  nextButton.textContent = current === order.length - 1 ? "See my results" : "Next question →";
  nextButton.classList.remove("hidden");
}

nextButton.addEventListener("click", () => {
  current++;
  if (current < order.length) {
    showQuestion();
  } else {
    document.querySelector("#game").classList.add("hidden");
    document.querySelector("#end").classList.remove("hidden");
    progressEl.textContent = "";
    document.querySelector("#result").textContent =
      `You scored ${score} out of ${order.length}. ${score === order.length
        ? "Perfect score—fantastic work!"
        : "Every round is a chance to learn something new!"}`;
  }
});

document.querySelector("#restart").addEventListener("click", startGame);
startGame();
</script>
